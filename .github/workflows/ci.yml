name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  install-matrix-safety:
    name: Install matrix / offline preflight safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test plan and preflight without privileges
        run: ./scripts/e2e/tests/test-install-update-matrix.sh
      - name: Test installed setup doctor/plan without source builds
        run: ./scripts/tests/test-setup-installed-doctor.sh
      - name: Check release dependency pin against Cargo version
        run: python3 scripts/tests/test-release-version-sync.py
      - name: Check pinned dist inputs and cache preservation
        run: ./scripts/tests/test-dist-sync-pins.sh
      - name: Check explicit runner-only target fails closed
        run: python3 -B scripts/lint/test_runner_only_manifest.py
      - name: Check read-only personal Pi onboarding inventory
        run: python3 -B scripts/dist/test-personal-pi-preflight.py

  # ---------------------------------------------------------------------------
  # Backend: check, clippy, fmt, test
  # ---------------------------------------------------------------------------
  backend-check:
    name: Backend / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libseccomp-dev

      - name: Check
        working-directory: backend
        run: cargo check --all-targets

      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        working-directory: backend
        run: cargo fmt --all -- --check

  backend-test:
    name: Backend / test
    runs-on: ubuntu-latest
    needs: backend-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libseccomp-dev

      - name: Test
        working-directory: backend
        run: cargo test

      - name: Runner user-plane smoke
        run: ./scripts/e2e/smoke-runner-user-plane.sh

  # ---------------------------------------------------------------------------
  # Frontend: lint, build, test
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Build
        working-directory: frontend
        run: bun run build

      - name: Test
        working-directory: frontend
        run: bun run test
