name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version-matched release tag'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  canonical-bundle:
    name: Canonical Linux x86_64 full bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify tag, versions, and publication regressions
        run: |
          python3 -m pip install 'tomli==2.2.1'
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          python3 -B scripts/release/check-tag-version.py --tag "$RELEASE_TAG"
          python3 -B scripts/tests/test-release-tag-version.py
          python3 -B scripts/tests/test-release-assets.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libseccomp-dev rsync
          python3 -m pip install 'tomli==2.2.1' 'ziglang==0.13.0'
          cargo install cargo-zigbuild --version 0.20.1 --locked
          rustup target add x86_64-unknown-linux-gnu
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$RUNNER_TEMP/zig"
          chmod 0755 "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Stage pinned defaults and portable binaries
        env:
          DIST_REQUIRE_GLIBC_FLOOR: '1'
          GLIBC_FLOOR: '2.28'
        run: |
          python3 - <<'PY'
          import os, tomli
          from pathlib import Path
          pins = tomli.loads(Path('dependencies.toml').read_text())['external']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"PI_AGENT_EXTENSIONS_REF={pins['pi-extensions']}\n")
              output.write(f"OQTO_TEMPLATES_REF={pins['oqto-templates']}\n")
          PY
      - name: Build canonical release bundle
        env:
          DIST_REQUIRE_GLIBC_FLOOR: '1'
          GLIBC_FLOOR: '2.28'
        run: |
          ./scripts/dist/sync.sh
          ./scripts/dist/stage-binaries.sh --build
          ./scripts/dist/stage-frontend.sh --build
          python3 -B scripts/lint/verify-dist-manifest.py
          ./scripts/dist/package.sh "$RELEASE_TAG" x86_64-unknown-linux-gnu
          python3 -B scripts/release/check-release-assets.py --tag "$RELEASE_TAG" --directory dist/out
          cd dist/out
          sha256sum "oqto-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-linux-bundle
          if-no-files-found: error
          path: |
            dist/out/*.tar.gz
            dist/out/checksums.txt

  release-draft:
    name: Attest and create reviewable release draft
    needs: canonical-bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-linux-bundle
          path: artifacts
      - name: Recheck downloaded release payload
        run: |
          python3 -m pip install 'tomli==2.2.1'
          python3 -B scripts/release/check-release-assets.py --tag "$RELEASE_TAG" --directory artifacts
          cd artifacts
          sha256sum -c checksums.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/*.tar.gz'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
