name: Pi stable candidate qualification
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pi-stable-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test fail-closed candidate contracts
        run: |
          python3 scripts/tests/test-pi-update.py
          python3 scripts/tests/test-pi-node-runtime.py
      - name: Discover exact official stable version
        id: discover
        shell: bash
        run: |
          python3 scripts/release/pi-update.py > "$RUNNER_TEMP/pi-discovery.json"
          python3 - "$RUNNER_TEMP/pi-discovery.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          eligible = plan['status'] == 'candidate' and not plan['major_review_required']
          with open(sys.argv[2], 'a') as out:
              print(f'eligible={str(eligible).lower()}', file=out)
          PY
      - name: Prepare immutable candidate and locked official runtime
        if: steps.discover.outputs.eligible == 'true'
        shell: bash
        run: |
          # No tokens, inherited npm config, user installation or live promotion.
          scripts/dist/stage-pi-node-runtime.sh "$RUNNER_TEMP/pi-known-good"
          python3 scripts/release/pi-update.py --prepare "$RUNNER_TEMP/pi-candidate" \
            --node "$RUNNER_TEMP/pi-known-good/node/bin/node" \
            > "$RUNNER_TEMP/pi-preparation.json"
          "$RUNNER_TEMP/pi-candidate/source/scripts/dist/stage-pi-node-runtime.sh" \
            "$RUNNER_TEMP/pi-candidate/runtime"
      - name: Native RPC and durable session qualification
        if: steps.discover.outputs.eligible == 'true'
        shell: bash
        run: |
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate"])' "$RUNNER_TEMP/pi-candidate/candidate.json")"
          python3 scripts/dist/test-pi-rpc-qualification.py \
            --binary "$RUNNER_TEMP/pi-candidate/runtime/pi" --expected-version "$version" \
            --output "$RUNNER_TEMP/pi-candidate/rpc-evidence"
      - name: Summarize promotion blockers truthfully
        if: always()
        shell: bash
        run: |
          {
            echo '## Pi candidate only — accepted pins unchanged'
            echo 'Discovery/preparation/RPC are not full release acceptance.'
            echo 'Automatic bump PR remains blocked until extension/SDK/control, packaged Node install/update/rollback, runner guard, strict doctor, authenticated full-shell, service/sandbox/provider and physical helper gates are integrated.'
            echo 'This workflow has no repository-write, publication or live-install permissions.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-candidate-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pi-discovery.json
            ${{ runner.temp }}/pi-preparation.json
            ${{ runner.temp }}/pi-candidate/candidate.json
            ${{ runner.temp }}/pi-candidate/lock-generation.log
            ${{ runner.temp }}/pi-candidate/rpc-evidence
            ${{ runner.temp }}/pi-candidate/source/dependencies.toml
            ${{ runner.temp }}/pi-candidate/source/scripts/dist/pi-node/package*.json
