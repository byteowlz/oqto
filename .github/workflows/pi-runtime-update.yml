name: Pi runtime update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pi-runtime-update
  cancel-in-progress: false

jobs:
  promote-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compatibility-test latest Pi and update deterministic lock
        run: ./scripts/dist/check-agent-runtime.sh --update-lock
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Open or update promotion PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- dependencies.toml; then
            echo "Pi runtime pin is already current"
            exit 0
          fi

          version="$(sed -n '/^\[external\]/,/^\[/{s/^pi *= *"\([^"]*\)".*/\1/p}' dependencies.toml | head -1)"
          branch="automation/pi-runtime-update"
          git config user.name "oqto-update-bot"
          git config user.email "oqto-update-bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add dependencies.toml
          git commit -m "deps: promote Pi runtime ${version}"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --title "deps: promote Pi runtime ${version}" \
              --body "Deterministic promotion generated by the Pi runtime gate: pinned release checksums, standalone binary version check, RPC startup, non-empty model discovery, and configured provider assertions. No LLM is involved."
          else
            gh pr create \
              --base "${GITHUB_REF_NAME:-master}" \
              --head "$branch" \
              --title "deps: promote Pi runtime ${version}" \
              --body "Deterministic promotion generated by the Pi runtime gate: pinned release checksums, standalone binary version check, RPC startup, non-empty model discovery, and configured provider assertions. No LLM is involved."
          fi
