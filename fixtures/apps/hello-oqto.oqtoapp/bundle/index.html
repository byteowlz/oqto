<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hello Oqto</title>
		<link rel="stylesheet" href="./assets/app.css" />
	</head>
	<body>
		<main>
			<p class="eyebrow">OQTO APP KV ACCEPTANCE</p>
			<h1>Persisted counter</h1>
			<p id="status" role="status">Connecting to the private Oqto Bridge…</p>
			<output id="count" aria-label="Counter value">0</output>
			<div class="actions">
				<button id="increment" type="button" disabled>Increment and save</button>
				<button id="reset" type="button" disabled>Reset</button>
			</div>
			<p class="hint">The value is authoritative backend state, isolated by Account and App Instance.</p>
		</main>
		<script src="./assets/app.js"></script>
	</body>
</html>
