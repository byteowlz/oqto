[meta]
template = "meeting-agenda.typ"
template_id = "meeting-agenda"
template_version = "1.0.0"

# Brand settings - iem brand colors
[brand]
logo = "logos/iem-logo.svg"

[brand.colors]
primary = "#1e40af"
accent = "#3b82f6"
text = "#1f2937"
muted = "#6b7280"

[meeting]
title = "Meeting with Lord Donshot"
date = "[Date]"
time = "[Time]"
location = "[Location/Virtual]"
duration = "[Duration]"

[meeting.organizer]
name = "[Your Name]"

# Attendees
[[meeting.attendees]]
name = "[Your Name]"
role = "Organizer"

[[meeting.attendees]]
name = "Lord Donshot"
role = "Key Stakeholder"

# Objectives
[[meeting.objectives]]
description = "[Primary objective 1]"

[[meeting.objectives]]
description = "[Primary objective 2]"

# Agenda Items
[blocks.opening]
title = "Opening & Welcome"
duration = "5 min"
format = "markdown"
content = """
- Introductions
- Meeting purpose confirmation
"""

[blocks.previous_actions]
title = "Previous Action Items Review"
duration = "10 min"
format = "markdown"
content = """
- Follow-up on outstanding items
- Status updates
"""

[blocks.main_topics]
title = "Main Discussion Topics"
duration = "[Time allocation]"
format = "markdown"
content = """
### Topic 1
**Background:** [Background information]
**Key points to address:** [Key points]
**Desired outcomes:** [Desired outcomes]

### Topic 2
**Background:** [Background information]
**Key points to address:** [Key points]
**Desired outcomes:** [Desired outcomes]

### Additional Topics
[Add more topics as needed]
"""

[blocks.decisions]
title = "Decision Points"
duration = "15 min"
format = "markdown"
content = """
- [Decision 1]
- [Decision 2]
- [Other decisions required]
"""

[blocks.next_steps]
title = "Next Steps & Action Items"
duration = "10 min"
format = "markdown"
content = """
- Review action items
- Assign responsibilities
- Set deadlines
"""

[blocks.wrap_up]
title = "Wrap-up & Next Meeting"
duration = "5 min"
format = "markdown"
content = """
- Summary of decisions
- Confirm next meeting date
- Open questions
"""

[blocks.preparation]
title = "Pre-meeting Preparation"
format = "markdown"
content = """
- [Preparation item 1]
- [Preparation item 2]
"""

[blocks.materials]
title = "Required Materials"
format = "markdown"
content = """
- [Document/material 1]
- [Document/material 2]
"""

[blocks.notes]
title = "Notes"
format = "markdown"
content = """
- [Special considerations]
- [Parking lot items for future discussion]
"""