[package]
name = "oqto-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Sandbox configuration and CLI for Oqto"

[lib]
name = "oqto_sandbox"
path = "src/lib.rs"

[dependencies]
oqto-egress = { path = "../oqto-egress" }
schemars = { workspace = true }
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
shellexpand.workspace = true
libc.workspace = true

[features]
# Enabled by default so a plain macOS build is sandboxed; the feature exists to
# make backend selection explicit, and a build without it fails closed rather
# than running unsandboxed.
default = ["macos-seatbelt"]

# Enforcement backends. Selecting a backend is separate from platform support:
# the Seatbelt profile compiler builds and is tested everywhere, while only the
# sandbox-exec invocation is macOS-gated.
macos-seatbelt = ["dep:which"]

[target.'cfg(target_os = "macos")'.dependencies]
tempfile.workspace = true
which = { version = "7", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
