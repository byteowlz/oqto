[package]
name = "oqto-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Dedicated runner daemon crate"

[[bin]]
name = "oqto-runner"
path = "src/main.rs"

[features]
default = []
integration-tests = []
iroh-transport = ["dep:iroh"]

[dependencies]
oqto-credential-http = { path = "../oqto-credential-http" }
rand = { workspace = true }
anyhow.workspace = true
base64.workspace = true
cap-std = "4.0.3"
portable-pty = "0.9"
async-trait.workspace = true
oqto-personal = { path = "../oqto-personal" }
oqto-personal-wire = { path = "../oqto-personal-wire", features = ["qr"] }
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
dialoguer = { version = "0.11", default-features = false }
env_logger.workspace = true
libc.workspace = true
log.workspace = true
once_cell.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
sha2.workspace = true
hex.workspace = true
rustix = { version = "1", features = ["process", "fs"] }
toml.workspace = true
tracing.workspace = true
trx-core.workspace = true
mmry-core.workspace = true
uuid.workspace = true
iroh = { version = "1.0.2", default-features = false, features = ["tls-ring"], optional = true }

oqto-history = { path = "../oqto-history" }
oqto-apps = { path = "../oqto-apps" }
serde_json.workspace = true
sqlx.workspace = true
oqto-protocol = { path = "../oqto-protocol" }
oqto-secrets = { path = "../oqto-secrets" }
oqto-pi = { path = "../oqto-pi" }
oqto-sandbox = { path = "../oqto-sandbox" }

[dev-dependencies]
ed25519-dalek = "2.2"
oqto-personal-wire = { path = "../oqto-personal-wire", features = ["tls"] }
rcgen = "0.13"
tempfile.workspace = true

[lints]
workspace = true

[[example]]
name = "iroh_probe"
required-features = ["iroh-transport"]
