[package]
name = "oqto-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Dedicated runner daemon crate"

[[bin]]
name = "oqto-runner"
path = "src/main.rs"

[features]
default = []
integration-tests = []
iroh-transport = ["dep:iroh"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
env_logger.workspace = true
libc.workspace = true
log.workspace = true
once_cell.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
toml.workspace = true
tracing.workspace = true
trx-core.workspace = true
mmry-core.workspace = true
uuid.workspace = true
iroh = { version = "1.0.2", default-features = false, features = ["tls-ring"], optional = true }

oqto-history = { path = "../oqto-history" }
serde_json.workspace = true
sqlx.workspace = true
oqto-protocol = { path = "../oqto-protocol" }
oqto-pi = { path = "../oqto-pi" }
oqto-sandbox = { path = "../oqto-sandbox" }

[dev-dependencies]
rcgen = "0.13"
tempfile.workspace = true

[lints]
workspace = true

[[example]]
name = "iroh_probe"
required-features = ["iroh-transport"]
