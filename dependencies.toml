# External Dependencies Manifest
#
# This file tracks the versions of external tools and services that Oqto depends on.
# Run `just update-deps` to refresh this manifest from local repos and git tags.

[oqto]
version = "0.5.11"
description = "Main platform (this repo)"

[byteowlz]
# Core backend services. All published via the shared byt release pipeline
# (ADR-0021): {name}-v{ver}-{triple}.tar.gz + bin/ + checksums.txt, consumed by
# `oqto-setup acquire`. Refresh with `just update-deps`.
eavs = "0.8.1"
mmry = "0.13.4"
trx = "0.7.1"
agntz = "0.3.2"
sx = "2.5.0"
scrpr = "1.3.0"
tmpltr = "0.3.2"
sldr = "0.10.0"
skdlr = "0.3.0"
ignr = "0.1.3"

# Exact entrypoint ownership for `oqto-setup acquire --install-bin`. These
# binaries come from each tool's pinned byt.release.toml; unexpected archive
# executables or claims on the platform's own bin names fail before mutation.
[binary_owners]
agntz = ["agntz"]
eavs = ["eavs"]
ignr = ["ignr"]
mmry = ["mmry", "mmry-mcp", "mmry-service", "mmry-tui"]
scrpr = ["scrpr"]
skdlr = ["skdlr", "skdlr-api", "skdlr-mcp", "skdlr-service", "skdlr-tui"]
sldr = ["sldr", "sldr-server"]
sx = ["sx"]
tmpltr = ["tmpltr"]
trx = ["trx", "trx-tui", "trx-mcp", "trx-api"]

[optional]
# Voice mode — GPU-best; no prebuilt binaries published, build from source when
# needed. Excluded from the managed acquisition set (oqto-setup acquire, ADR-0018).
eaRS = "0.4.8"
kokorox = "0.2.3"

[external]
# Not byteowlz, but required for Oqto
# pi + pi-extensions are PINNED (not "latest") so deploys are deterministic; the
# latest stable candidates are prepared by scripts/release/pi-update.py in an
# isolated snapshot. Advance accepted pins only after coherent qualification;
# the legacy standalone smoke is not a Node/npm release acceptance gate.
# Sync accepted sources via scripts/dist/sync-agent-runtime.sh.
pi = "1.3.0"  # qualified Linux x86_64 candidate; activate through guarded deployment
pi-linux-x64-sha256 = "24f5be328b66d4da36876296989501974f43ab8434fbb57c35c523a3ea505ded"
pi-linux-arm64-sha256 = "7fd2ea14fca390ebf9f47438baaef07c4b3d13db7cc8e459831118391b7ea65b"
# Official Node/npm runtime; standalone archives remain separate explicit acquisition inputs.
node = "24.14.1"
node-linux-x64-sha256 = "84d38715d449447117d05c3e71acd78daa49d5b1bfa8aacf610303920c3322be"
pi-extensions = "e70d7259cb1126eb8ddb4bea59236a390dedad32"  # coherent collection 2.9.0; candidate qualification required
oqto-templates = "1629eb05f703a2490e19322fef85fa63dd2746d3"  # immutable release defaults revision
typst = "0.15.1"  # Required by tmpltr: https://github.com/typst/typst
uv = "0.11.29"  # Python package manager: https://github.com/astral-sh/uv
