# EAVS Configuration for container environment
# Virtual API keys and provider routing

[server]
host = "0.0.0.0"
port = 41823

# Providers - API keys are injected via environment variables
# The backend creates a virtual key per session with budget/rate limits

[providers.default]
type = "openai"
api_key = "env:OPENAI_API_KEY"

[providers.anthropic]
type = "anthropic"
api_key = "env:ANTHROPIC_API_KEY"

[providers.google]
type = "google"
api_key = "env:GEMINI_API_KEY"

# Virtual API Keys - enabled for session-based access control
[keys]
enabled = true
database_path = "~/.local/share/eavs/keys.db"
# Master key is injected by the backend when creating session keys
master_key = "env:EAVS_MASTER_KEY"

# Logging - JSON for backend consumption
[logging]
default = "stdout"

[[logging.backends]]
type = "stdout"
format = "json"

# Conversation state tracking
[state]
enabled = true
ttl_secs = 3600
cleanup_interval_secs = 60
max_conversations = 100
